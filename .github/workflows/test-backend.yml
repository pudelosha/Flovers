name: Backend quality checks

on:
  # Validation remains automatic; production release is a separate manual workflow.
  push:
    paths:
      - "backend/**"
      - "deployment/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/test-backend.yml"
      - "firmware/**"
      - ".github/workflows/test-firmware.yml"
      - "contracts/**"
      - ".github/workflows/test-api-contracts.yml"
      - "mobile/src/api/**"
      - "mobile/src/features/**/types/**"
      - ".github/scripts/**"
      - ".github/test-policies/**"
  workflow_call:
    outputs:
      job_results:
        description: Actual results of every mandatory job in this reusable suite
        value: ${{ toJSON(jobs) }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Backend test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flovers_ci
          POSTGRES_USER: flovers_ci
          POSTGRES_PASSWORD: flovers_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flovers_ci -d flovers_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: app.ci_settings
      CI_DATABASE_URL: postgres://flovers_ci:flovers_ci@127.0.0.1:5432/flovers_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Test CI reporting tools
        working-directory: .
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Install locked application dependencies
        id: dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-ci.txt
          python -m pip check
      - name: Validate CPU wheels and real recognition model
        run: python scripts/check_recognition.py
      - name: Require the isolated PostgreSQL service and host compiler
        working-directory: .
        run: |
          python .github/scripts/check_ci_postgres.py
          g++ --version
      - name: Validate models and migration consistency
        run: |
          python manage.py check --tag models
          python manage.py makemigrations --check --dry-run --skip-checks
      - name: Test deployment safeguards
        working-directory: .
        run: python .github/scripts/run_ci_unit_tests.py deployment
      - name: Run full application suite on PostgreSQL
        env:
          FLOVERS_TEST_CPP: g++
        run: >-
          python -m pytest -m "not firmware_compile" -ra --durations=10
          --junitxml=test-results/backend.xml
          --cov=. --cov-config=.coveragerc
          --cov-report=term:skip-covered
          --cov-report=json:test-results/coverage.json
          --cov-report=xml:test-results/coverage.xml
          --cov-report=html:test-results/coverage-html
      - name: Summarize tests, coverage and skipped cases
        if: always()
        run: >-
          python ../.github/scripts/report_tests.py
          --title "Backend pytest"
          --junit test-results/backend.xml
          --coverage test-results/coverage.json --coverage-kind python
          --policy ../.github/test-policies/backend.json
          --coverage-scope "All backend Python source; tests, fixtures, migrations and manage.py excluded. Separate subprocess checks are not merged."
          --output test-results/summary.md
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 7
