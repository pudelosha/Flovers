name: Backend quality checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "deployment/**"
      - "docker-compose.yml"
      - ".github/workflows/test-backend.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flovers_ci
          POSTGRES_USER: flovers_ci
          POSTGRES_PASSWORD: flovers_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flovers_ci -d flovers_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: app.ci_settings
      CI_DATABASE_URL: postgres://flovers_ci:flovers_ci@127.0.0.1:5432/flovers_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU-only application dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Validate models and migration consistency
        run: |
          python manage.py check --tag models
          python manage.py makemigrations --check --dry-run --skip-checks
      - name: Test deployment safeguards
        working-directory: .
        run: python -m unittest discover -s deployment -p 'test_deploy_backend.py'
      - name: Run full application suite on PostgreSQL
        run: python -m pytest --junitxml=test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 7
