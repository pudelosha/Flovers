name: ESP32 firmware compilation

on:
  push:
    paths:
      - "firmware/**"
      - "backend/readings/**"
      - "backend/requirements*"
      - "backend/.python-version"
      - "backend/pytest.ini"
      - "backend/app/ci_settings.py"
      - "web/src/assets/firmware-example.ino"
      - "mobile/src/api/services/readings.service.ts"
      - "mobile/src/features/readings/types/**"
      - ".github/workflows/test-firmware.yml"
      - ".github/workflows/test-backend.yml"
      - ".github/scripts/**"
      - ".github/test-policies/**"
  pull_request:
    paths:
      - "firmware/**"
      - "backend/readings/**"
      - "backend/requirements*"
      - "backend/.python-version"
      - "backend/pytest.ini"
      - "backend/app/ci_settings.py"
      - "web/src/assets/firmware-example.ino"
      - "mobile/src/api/services/readings.service.ts"
      - "mobile/src/features/readings/types/**"
      - ".github/workflows/test-firmware.yml"
      - ".github/workflows/test-backend.yml"
      - ".github/scripts/**"
      - ".github/test-policies/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Required ESP32-C3 sketches
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: app.ci_settings
      FLOVERS_REQUIRE_FIRMWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Install locked test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r backend/requirements.txt -r backend/requirements-ci.txt
      - name: Verify firmware provisioning safeguards
        run: python -m unittest discover -s firmware/ci/tests -p 'test_*.py'
      - name: Provision exact Arduino CLI, ESP32 core and sensor dependencies
        run: >-
          python firmware/ci/provision.py --root "$RUNNER_TEMP/flovers-esp32"
          --results "$GITHUB_WORKSPACE/firmware-results" --github-env "$GITHUB_ENV"
      - name: Compile real generated sensors-only and pump sketches
        working-directory: backend
        run: >-
          python -m pytest readings/tests/test_codegen.py -m firmware_compile
          -ra --junitxml=../firmware-results/firmware.xml
      - name: Require both compilation identities and reject any skipped test
        if: always()
        run: >-
          python .github/scripts/report_tests.py --title "Required ESP32-C3 firmware compilation"
          --junit firmware-results/firmware.xml --policy .github/test-policies/firmware.json
          --output firmware-results/summary.md
      - name: Upload compiler logs, target provenance, generated sketches and binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp32-firmware-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: firmware-results/
          if-no-files-found: warn
          retention-days: 7
