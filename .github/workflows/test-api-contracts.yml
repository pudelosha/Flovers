name: API compatibility contracts

on:
  push:
    paths:
      - "contracts/**"
      - "backend/**"
      - "mobile/src/**"
      - "mobile/package*.json"
      - "mobile/*config*"
      - "translations/**"
      - ".github/scripts/**"
      - ".github/test-policies/**"
      - ".github/workflows/test-api-contracts.yml"
  workflow_call:
    outputs:
      job_results:
        description: Actual results of every mandatory job in this reusable suite
        value: ${{ toJSON(jobs) }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    name: Django provider verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flovers_ci
          POSTGRES_USER: flovers_ci
          POSTGRES_PASSWORD: flovers_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flovers_ci -d flovers_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      DJANGO_SETTINGS_MODULE: contracts.api.settings
      CI_DATABASE_URL: postgres://flovers_ci:flovers_ci@127.0.0.1:5432/flovers_ci
      CONTRACT_PROVIDER_SHA: ${{ github.sha }}
      CONTRACT_BUNDLE: ${{ github.workspace }}/contract-results/provider.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Install exact application and test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r backend/requirements.txt -r backend/requirements-ci.txt
      - name: Verify pinned previous-client sources against Git history
        run: python contracts/api/check_sources.py
      - name: Require PostgreSQL 16 in the isolated test service
        env:
          DJANGO_SETTINGS_MODULE: app.ci_settings
        run: python .github/scripts/check_ci_postgres.py
      - name: Verify contracts through real DRF requests
        run: >-
          python -m pytest -c contracts/api/pytest.ini contracts/api/test_provider.py
          --junitxml=contract-results/provider.xml
      - name: Report every provider result and reject skips
        if: always()
        run: >-
          python .github/scripts/report_tests.py --title "Django API contracts"
          --junit contract-results/provider.xml
          --policy .github/test-policies/no-skips.json
          --output contract-results/provider-summary.md
      - name: Publish verified response artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract-results/provider.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish provider diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-provider-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract-results/
          if-no-files-found: warn
          retention-days: 7

  consumers:
    name: Current and previous mobile compatibility
    needs: provider
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONTRACT_PROVIDER_SHA: ${{ github.sha }}
      CONTRACT_BUNDLE: ${{ github.workspace }}/contract-results/provider.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked mobile tooling
        working-directory: mobile
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: api-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract-results
      - name: Run both actual clients against this run's verified responses
        run: >-
          node mobile/node_modules/jest/bin/jest.js --config contracts/api/jest.config.cjs
          --ci --maxWorkers=2 --json --outputFile=contract-results/consumers.json
      - name: Report consumer results and reject skips or TODO cases
        if: always()
        run: >-
          python3 .github/scripts/report_tests.py --title "Current and previous mobile API contracts"
          --jest contract-results/consumers.json --policy .github/test-policies/no-skips.json
          --output contract-results/consumer-summary.md
      - name: Publish compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-consumer-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract-results/
          if-no-files-found: warn
          retention-days: 7

  compatibility:
    name: API compatibility gate
    if: always()
    needs: [provider, consumers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both provider and consumer success
        env:
          PROVIDER_RESULT: ${{ needs.provider.result }}
          CONSUMER_RESULT: ${{ needs.consumers.result }}
        run: test "$PROVIDER_RESULT" = success && test "$CONSUMER_RESULT" = success
