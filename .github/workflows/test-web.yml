name: Website quality checks

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/test-web.yml"
      - ".github/workflows/deploy-web.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test website content and translations
        run: npm test
      - name: Check production build
        run: npm run build
