name: Deploy backend (VPS)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "deployment/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Serialize builds and deployments, including manual runs on other branches.
concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test deployment sequence and image retention
        run: python3 -m unittest discover -s deployment -p 'test_deploy_backend.py'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/pudelosha/flovers:latest
            ghcr.io/pudelosha/flovers:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_SHA: ${{ github.sha }}
      BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment script
        id: deployment-script
        shell: bash
        run: echo "payload=$(base64 -w 0 deployment/deploy_backend.py)" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SCRIPT: ${{ steps.deployment-script.outputs.payload }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA,BACKEND_SERVICE,DEPLOY_SCRIPT
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/app
            python3 -c 'import base64, os; exec(compile(base64.b64decode(os.environ["DEPLOY_SCRIPT"], validate=True), "<deployment>", "exec"))'
