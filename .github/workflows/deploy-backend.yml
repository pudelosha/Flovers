name: Deploy backend (VPS)

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: LIGHT refuses migrations; FULL requires verified recovery prerequisites
        required: true
        type: choice
        default: LIGHT
        options: [LIGHT, FULL]
      revision:
        description: Full 40-character main revision selected for this release
        required: true
        type: string
      confirmation:
        description: Type DEPLOY BACKEND then the mode and exact revision (separated by spaces)
        required: true
        type: string

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize owner-requested backend release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require owner confirmation and existing environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/production_gate.py backend

  quality:
    needs: authorize
    uses: ./.github/workflows/test-backend.yml
    permissions:
      contents: read

  release:
    name: Approved backend build and deployment
    needs: [authorize, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production-backend
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_APPROVED_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.deployment_mode }}
      DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Recheck authorization after environment review
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST_FINGERPRINT: ${{ vars.VPS_HOST_FINGERPRINT }}
        run: |
          python3 .github/scripts/production_gate.py backend
          test -n "$VPS_HOST_FINGERPRINT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable release revision
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pudelosha/flovers:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Prepare versioned deployment bundle
        id: deployment-script
        run: python3 deployment/package_release.py >> "$GITHUB_OUTPUT"
      - name: Revalidate approved main revision and complete CI immediately before SSH
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/production_gate.py backend
      - name: Deploy approved digest to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ghcr.io/pudelosha/flovers@${{ steps.image.outputs.digest }}
          DEPLOY_SCRIPT: ${{ steps.deployment-script.outputs.payload }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA,DEPLOY_APPROVED_SHA,DEPLOY_MODE,DEPLOY_RUN_ID,DEPLOY_IMAGE,BACKEND_SERVICE,DEPLOY_SCRIPT
          command_timeout: 40m
          script: |
            set -eu
            cd /opt/app
            python3 -c 'import base64, os; exec(compile(base64.b64decode(os.environ["DEPLOY_SCRIPT"], validate=True), "<approved-deployment>", "exec"))'
      - name: Record approved release identity
        run: |
          echo "Backend revision: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback metadata: /opt/app/.flovers-deployments/$DEPLOY_RUN_ID-$DEPLOY_SHA/manifest.json" >> "$GITHUB_STEP_SUMMARY"
