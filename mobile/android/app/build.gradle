apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// The separately named, debug-signed smoke APK has no Firebase project.
def floversE2E = project.findProperty("floversE2E") == "true"
if (!floversE2E) {
    apply plugin: "com.google.gms.google-services"
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

import java.util.Properties
import java.io.FileInputStream

/** React-native-config env mapping */
project.ext.envConfigFiles = [
    debug  : ".env.production",
    release: ".env.production"
]

react {
    autolinkLibrariesWithApp()
    if (floversE2E) {
        entryFile = file("../../e2e.index.js")
    }
}

// Cover direct Gradle/Android Studio builds as well as npm commands.
def buildInfoReactExtension = project.extensions.getByName("react")
def generateBuildInfo = tasks.register("generateBuildInfo", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine(buildInfoReactExtension.nodeExecutableAndArgs.get() + ["scripts/generate-build-info.js"])
    outputs.file(new File(rootProject.projectDir.parentFile, "src/buildInfo.ts"))
    outputs.upToDateWhen { false }
}
tasks.configureEach { task ->
    if (task.name == "preBuild" || (task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets"))) {
        task.dependsOn(generateBuildInfo)
    }
}

/**
 * Set this to true to run Proguard on release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore flavor (used when Hermes is disabled)
 */
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.flovers.mobile"

    defaultConfig {
        applicationId "com.flovers.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [
            usesCleartextTraffic: true
        ]
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles(
                getDefaultProguardFile("proguard-android.txt"),
                "proguard-rules.pro"
            )
        }
        if (floversE2E) {
            e2e {
                // Native app code and prebuilt React/SVG libraries must agree on
                // release/debug C++ layouts. A bundled, non-debuggable app cannot
                // consume debug fallback libraries safely under Fabric.
                initWith release
                matchingFallbacks = ["release"]
                applicationIdSuffix ".e2e"
                signingConfig signingConfigs.debug
                // Bundle actual JS/Hermes into the APK; no Metro dependency.
                debuggable false
                buildConfigField "String", "API_BASE", '"http://10.0.2.2:8000"'
                buildConfigField "String", "PUBLIC_BASE_URL", '"http://10.0.2.2:8000"'
                buildConfigField "String", "E2E_MODE", '"true"'
                resValue "string", "build_config_package", "com.flovers.mobile"
            }
        }
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")

    // Android 12+ splash screen support
    implementation("androidx.core:core-splashscreen:1.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation(jscFlavor)
    }
}
